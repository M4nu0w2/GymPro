    <script>
      // Applica il tema prima del primo render per evitare flash
      try {
        var t = localStorage.getItem('gympro.theme') || 'system';
        var s = localStorage.getItem('gympro.settings');
        if (s && s.indexOf('progression') === -1) t = 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
      } catch (e) {}
    </script>

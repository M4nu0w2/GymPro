<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#d4fb6a"/>
      <stop offset="0.55" stop-color="#9ee22c"/>
      <stop offset="1" stop-color="#5fae00"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a10"/>
      <stop offset="1" stop-color="#0b1200"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2d5200" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <!-- Disco in vetro -->
  <circle cx="256" cy="256" r="170" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
  <!-- Manubrio stilizzato, ruotato -->
  <g transform="rotate(-35 256 256)" filter="url(#shadow)">
    <rect x="150" y="241" width="212" height="30" rx="10" fill="url(#metal)"/>
    <rect x="112" y="178" width="42" height="156" rx="16" fill="url(#metal)"/>
    <rect x="82" y="206" width="26" height="100" rx="11" fill="url(#metal)" opacity="0.9"/>
    <rect x="358" y="178" width="42" height="156" rx="16" fill="url(#metal)"/>
    <rect x="404" y="206" width="26" height="100" rx="11" fill="url(#metal)" opacity="0.9"/>
  </g>
</svg>
